# arrow-rs-style fork-ci bridge, manual sweeps only (test for apache/infrastructure-actions#1513).
name: "Bridge fork-ci v1.0.1"
on:
  workflow_dispatch:
permissions:
  actions: read
  checks: write
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  bridge:
    if: github.repository == 'geographybuff-sandbox/fork-ci-1513-test'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: apache/infrastructure-actions/fork-ci@adff9de8b5e0386b4a2315f298ca9c2679cbb700  # fork-ci/v1.0.1
        with:
          workflow: ci.yml
          check-name: CI (fork) v1.0.1
          base-branches: main
          guide-url: https://github.com/apache/arrow-rs/blob/main/CONTRIBUTING.md#pull-requests-from-forks
          sweep-minutes: '15'
